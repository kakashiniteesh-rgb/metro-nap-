name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 \
            @capacitor/local-notifications@7 @capacitor-community/background-geolocation
          npx cap init "Metro Wake-up" com.metrowakeup.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P=""
          for perm in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION \
                      FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS \
                      SCHEDULE_EXACT_ALARM USE_EXACT_ALARM USE_FULL_SCREEN_INTENT \
                      WAKE_LOCK VIBRATE; do
            P="$P    <uses-permission android:name=\"android.permission.$perm\"/>\n"
          done
          sed -i "s#</manifest>#$P</manifest>#" $M
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metro-wakeup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
