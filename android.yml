name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange web files
        run: |
          mkdir -p www assets
          mv index.html www/
          mv icon-only.png icon-foreground.png icon-background.png splash.png assets/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash screen
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Add permissions
        run: node patch-manifest.js

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: metro-wakeup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
